# Suite propia de las herramientas de investigación de htr/ (spec 001).
# Se ejecuta dentro del contenedor: docker compose exec servidor-htr pytest
[pytest]
testpaths = tests
pythonpath = .
# Sin caché de pytest: evita que aparezca .pytest_cache en el repositorio,
# porque htr/ está montado como volumen en el contenedor.
addopts = -p no:cacheprovider -m "not integracion"
markers =
    integracion: necesita GPU, pesos en caché o Tika arriba. Fuera de la corrida por omisión; se corre con: pytest -m integracion
