[pytest]
# Suite de pruebas del backend (spec 002). Se corre con `docker compose exec backend pytest`.
testpaths = tests
pythonpath = .
# - `-p no:cacheprovider`: sin carpeta .pytest_cache (como en htr/).
# - `--import-mode=importlib`: los archivos de prueba no necesitan __init__.py.
# - `-m "not infraestructura"`: las pruebas de ese marcador producen fallos a propósito y
#   solo corren con `pytest -m infraestructura` (un -m en la línea de comandos tiene la última palabra).
addopts = -p no:cacheprovider --import-mode=importlib -m "not infraestructura"
# Un fallo esperado que pasa (XPASS) hace fallar la corrida: así se quita su marca.
xfail_strict = true
markers =
    unitaria: lógica del backend con SQL Server, Qdrant, Tika, Ollama y Redis simulados (se asigna por carpeta)
    integracion: la API con SQL Server, Qdrant y Tika reales del entorno de pruebas (se asigna por carpeta)
    infraestructura: pruebas que producen fallos a propósito o lanzan otra corrida; solo con -m infraestructura (se asigna por carpeta)
    requisito(id): requisito del ERS que cubre la prueba, por ejemplo RF-19.1 (convención, no se exige)
