services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude 'uploads/*' --reload-exclude '*.pyc'"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TIKA_SERVER_URL=http://tika:9998
      - HTR_SERVER_URL=http://servidor-htr:9100
    depends_on:
      - redis
      - tika
      - servidor-htr
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G  # Modelo embeddings (~3GB) + overhead FastAPI
        reservations:
          memory: 2G

  # Worker de Celery para procesamiento asíncrono (compatible PC local y VM)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: /venv/bin/celery -A celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=20 --max-memory-per-child=6000000 --pool=prefork
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
      - ./backend/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TIKA_SERVER_URL=http://tika:9998
      - HTR_SERVER_URL=http://servidor-htr:9100
    depends_on:
      - redis
      - tika
      - servidor-htr
      - backend
    restart: unless-stopped
    mem_limit: 8G  # Modelo embeddings (~3GB) + Audio chunks (~2GB) + overhead
    mem_reservation: 2G

  tika:
    build:
      context: ./backend
      dockerfile: Dockerfile.tika
    ports:
      - "9998:9998"
    volumes:
      - ./backend/tika-config.xml:/app/tika-config.xml
    restart: unless-stopped
    environment:
      # Memoria dinámica: mín 256MB, máx 2GB (para OCR pesado en VM)
      - TIKA_SERVER_OPTS=-Xms256m -Xmx2048m

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # Memoria aumentada: 256MB → 1GB para manejar archivos grandes y embeddings
    # Policy: allkeys-lru elimina claves menos usadas cuando se llena
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru

  # SQL Server local (reemplaza la instancia en Azure — Fase 1: ambiente local)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      # IMPORTANTE: esta contraseña debe coincidir con SQL_SERVER_PASSWORD en backend/.env
      - MSSQL_SA_PASSWORD=Local_Strong_Pass123!
      - MSSQL_PID=Developer  # Edición Developer: gratuita, todas las funciones, solo para desarrollo
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    mem_limit: 2G

  # Ollama local - LLM para el RAG (modelo definitivo: llama3.1:8b, elegido según GPU disponible — Fase 2)
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Devuelve la VRAM tras 2 min sin uso. Es la contraparte del
      # intercambio: el servidor de HTR hace lo mismo (HTR_IDLE_TIMEOUT),
      # así ninguno de los dos expulsa al otro de la GPU. Ver doc 22.
      - OLLAMA_KEEP_ALIVE=2m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Qdrant local - base de datos vectorial (Fase 2: backend conmutable, activo cuando VECTORSTORE_BACKEND=qdrant)
  qdrant:
    image: qdrant/qdrant
    ports: 
      - "6333:6333" #API REST
      - "6334:6334" #API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Servicio para generación de diagramas de arquitectura
  diagrams:
    build:
      context: ./diagrams
      dockerfile: Dockerfile
    volumes:
      - ./diagrams:/diagrams
      - ./diagrams/output:/diagrams/output
    restart: "no"  # Ejecuta una vez y termina
    profiles:
      - tools  # Solo se ejecuta cuando se especifica: docker-compose --profile tools up diagrams

  # Servidor de HTR - reconocimiento de escritura a mano alzada (Fase 4).
  # Mismo patron que Tika: contenedor propio que el backend consume por
  # HTTP. Es el unico servicio, junto con Ollama, que necesita GPU.
  #
  # Modelo elegido en el Ciclo 1 (doc 22): trocr-large-handwritten,
  # CER 0.2771 sobre letra humana real.
  #
  # HTR_IDLE_TIMEOUT: segundos sin peticiones antes de devolver la GPU.
  # Junto con OLLAMA_KEEP_ALIVE implementa el intercambio de GPU entre
  # ambos servicios (2.1 GB del HTR + 5.5 GB de Ollama = 7.6 GB de 8 GB:
  # entra, pero sin margen, asi que conviene que cada uno libere al
  # quedar inactivo).
  servidor-htr:
    build:
      context: ./htr
      dockerfile: Dockerfile
    command: uvicorn servidor_htr:app --host 0.0.0.0 --port 9100
    ports:
      - "9100:9100"
    volumes:
      - ./htr:/htr
      - htr_hf_cache:/cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/cache/huggingface
      - HTR_MODELO=microsoft/trocr-large-handwritten
      - HTR_IDLE_TIMEOUT=120
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data:
  sqlserver_data:
  ollama_data:
  qdrant_data:
  htr_hf_cache:
